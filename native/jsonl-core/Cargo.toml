[package]
name = "jsonl-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2.8.3"
napi = { version = "3.12.4", default-features = false, features = ["napi8"] }
napi-derive = "3.6.5"

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

schema: jsonlview.documentation-metadata
version: 2
description: "Canonical per-file YAML front matter for product Markdown and MDX documents."
frontMatter:
  required: [id, path, title, kind, status, owner, tags, evidence, revisit, rollback]
  kinds: [index, guide, roadmap, decision, design, policy, reliability, security]
  statuses: [active, accepted, experimental, planned, proposed, historical, superseded, draft, archived, deleted]
  owners: [product]
  extensionPrefix: x-
index:
  path: docs/index.json
  generated: true
  integrity: [bytes, sha256]

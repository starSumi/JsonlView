schema: jsonlview.documentation-metadata
version: 2
description: "Canonical per-file YAML front matter for product Markdown and MDX documents."
frontMatter:
  required: [id, path, title, kind, status, owner, tags, evidence, revisit, rollback]
  kinds: [index, guide, roadmap, decision, design, policy, reliability, security]
  statuses: [active, accepted, experimental, planned, proposed, historical, superseded, draft, archived, deleted]
  owners: [product]
  extensionPrefix: x-
index:
  path: docs/index.json
  generated: true
  integrity: [bytes, sha256]
extensions:
  x-priority: "Maintenance priority (P0-P3); it does not change evidence strength."
  x-freshness: "Currentness label for the document contract."
  x-review-cadence: "Trigger or interval for the next review."
  x-last-reviewed: "Date of the last substantive review, not the file migration date."
  x-supersedes: "Repository-relative document path replaced by this document."
  x-superseded-by: "Repository-relative document path that replaces this document."
